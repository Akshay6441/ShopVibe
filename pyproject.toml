[project]
name = "shopvibe"
version = "3.0.0"
description = "ShopVibe E-Commerce Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13.2",
    "stripe>=10.5.0",
    "requests>=2.32.3",
    "google-auth>=2.32.0",
    "openai>=1.35.7",
    "prometheus-client>=0.20.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
